<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdZero · UI 交互预览</title>
<link rel="stylesheet" href="/theme/css/cascade.css">
<style>
body { margin:0; background:#eef1f4; font-family:system-ui,sans-serif; }
.preview-tools { padding:12px 20px; display:flex; align-items:center; flex-wrap:wrap; gap:12px; font-size:12px; background:#fff; color:#4d5952; border-bottom:1px solid #ddd; }
.preview-tools label { display:flex; align-items:center; gap:7px; margin:0; }
.preview-tools select { padding:5px 8px; width:auto; height:auto; font-size:12px; }
.preview-tools input { margin:0; }
.preview-shell { position:relative; }
.preview-shell > .main-right { min-height:calc(100vh - 60px); height:auto; overflow:visible; }
.preview-main { padding:0; margin:0; }
.preview-sidebar { display:none; position:absolute; width:240px; padding:28px; color:#5e72e4; font-size:22px; font-weight:700; }
.with-sidebar .preview-sidebar { display:block; }
.with-sidebar .preview-shell { margin-left:240px; }
.with-sidebar .preview-sidebar { left:-240px; }
[data-theme=dark] body { background:#101b15; }
@media(max-width:760px) { .preview-tools { padding:10px 12px; gap:8px; } .with-sidebar .preview-shell { margin-left:0; } .with-sidebar .preview-sidebar { display:none; } }
</style></head><body><div class="preview-tools"><strong>本地交互预览 · 模拟操作，不连接路由器</strong>
<label>场景 <select id="scenario"><option value="on">已开启 / NaiLink</option><option value="off">未开启</option><option value="multi">多个代理冲突</option><option value="recovery">需要恢复</option><option value="error">连接中断</option></select></label>
<label>外观 <select id="appearance"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<label><input id="fail" type="checkbox">模拟操作失败</label><label><input id="sidebar" type="checkbox">模拟侧栏占位</label><label><input id="host-frame" type="checkbox" checked>Argon 完整外壳</label><button id="reload">模拟慢速首次读取（5 秒）</button><span id="timing" role="status"></span><span id="calls" role="status">操作次数：0</span></div>
<div class="preview-shell"><aside class="preview-sidebar">OpenWrt<br><small>服务 · AdZero</small></aside><div class="main-right" id="preview-host"><header class="bg-primary" aria-label="宿主主题顶部区域"><div class="fill"><div class="container"><span class="flex1"></span></div></div></header><div class="darkMask"></div><div id="maincontent"><div class="container"><main class="preview-main" id="preview"></main></div></div></div></div><script src="/native-dom.js"></script><script src="/ui_preview.js"></script></body></html>
