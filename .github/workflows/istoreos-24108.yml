name: iStoreOS 24.10.8 native OPKG beta checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_istoreos_24108_beta.py'
      - 'scripts/install_istoreos_24108_beta.sh'
      - 'scripts/check_istoreos_24108_opkg_solver.py'
      - 'tests/test_istoreos_24108_beta.py'
      - 'tests/test_install_auto.py'
      - 'scripts/install-auto.sh'
      - 'docs/RELEASE_ISTOREOS_24108_BETA_0.21.5.md'
      - 'docs/ISTOREOS_24_10.md'
      - 'docs/evidence/istoreos-24.10.8/**'
      - '.github/workflows/istoreos-24108.yml'
      - 'docs/site/content/installation.html'
      - 'docs/site/content/compatibility.html'
permissions:
  contents: read
jobs:
  candidate-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and isolated OPKG menu tests
        run: |
          set -eu
          python3 -m py_compile scripts/build_istoreos_24108_beta.py scripts/check_istoreos_24108_opkg_solver.py
          sh -n scripts/install_istoreos_24108_beta.sh
          python3 -m unittest discover -s tests -p test_istoreos_24108_beta.py -v
          python3 -m unittest discover -s tests -p test_install_auto.py -v
          sh -n scripts/install-auto.sh
      - name: Exact target and firmware provenance guard
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from build_istoreos_24108_beta import PROFILES, VER, REV
          record=json.loads(Path("docs/evidence/istoreos-24.10.8/original-image-opkg-dependency-readiness.json").read_text())
          assert record["firmware"]=="istoreos"
          assert record["release"]==VER=="24.10.8"
          assert record["revision"]==REV=="2026073111"
          assert record["not_entire_2410_family"] is True
          assert record["stable_sdk_verified"] is False
          assert set(record["profiles"])==set(PROFILES)
          for profile,spec in PROFILES.items():
              p=record["profiles"][profile]
              assert p["target"]==spec["target"]
              assert p["arch"]==spec["arch"]
              assert p["original_image_sha256"]==spec["image_sha"]
              assert p["original_image_raw_sha256"]==spec["raw_sha"]
              assert p["original_config_buildinfo_sha256"]==spec["config_sha"]
              assert p["original_feeds_buildinfo_sha256"]==spec["feed_sha"]
              assert p["original_pinned_vendor_feeds"]==spec["feed_count"]
              assert len(p["missing_dependencies"])==7
              assert p["original_full_tcpdump_preserved"] is True
              assert p["device_acceptance"]=="not_run"
          stable=json.loads(Path("docs/compatibility-matrix.json").read_text())
          assert len(stable["sdk_verified"])==5
          assert not any(x["firmware"]=="istoreos" for x in stable["sdk_verified"])
          public=json.loads(Path("docs/evidence/istoreos-24.10.8/public-beta-0.21.5-native-build-assets.json").read_text())
          assert public["release_tag"]=="v0.21.5-istoreos-24108-beta.1"
          assert public["release"]==VER and public["revision"]==REV
          assert public["channel"]=="public_opt_in_beta_not_stable"
          assert public["historical_vendor_source_exact_factory_revision_attested"] is False
          assert public["physical_device_acceptance"]=="not_run"
          assert public["release_stable_sdk_verified_changed"] is False
          assert public["default_filtering_enabled"] is False
          assert set(public["profiles"])==set(PROFILES)
          import re
          code=Path("scripts/install-auto.sh").read_text()
          import hashlib
          pin=re.search(r"INSTALL_SHA256=([0-9a-f]{64})",code)
          assert pin and pin.group(1)==hashlib.sha256(Path("scripts/install.sh").read_bytes()).hexdigest()
          assert "PIN_ISTOREOS24108" not in code
          for profile,spec in PROFILES.items():
              row=public["profiles"][profile]
              assert row["target"]==spec["target"]
              assert row["arch"]==spec["arch"]
              assert row["opkg_no_network_simulated_package_count"]==8
              assert row["original_ipk_file_lists"]==row["original_installed_packages"]
              assert row["opkg_simulator_no_upgrade_remove_reinstall"]
              assert row["factory_installed_database_unchanged"]
              assert row["factory_full_tcpdump_retained"]
              assert row["physical_device_acceptance"]=="not_run"
          print("Exact three iStoreOS 24.10.8 OPKG targets isolated from stable SDK install matrix")
          PY
