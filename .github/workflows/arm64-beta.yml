name: OpenWrt / ImmortalWrt ARM64 beta installer checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_arm64_beta.py'
      - 'scripts/install_arm64_beta.sh'
      - 'tests/test_arm64_beta.py'
      - 'docs/RELEASE_ARM64_BETA_0.21.5.md'
      - 'docs/evidence/arm64-public-beta-0.21.5-assets.json'
      - 'docs/ARM64.md'
      - 'docs/compatibility-matrix.json'
      - '.github/workflows/arm64-beta.yml'
permissions:
  contents: read
jobs:
  beta-source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify beta package evidence without changing production manifest
        run: |
          set -eu
          python3 -m py_compile scripts/build_arm64_beta.py tests/test_arm64_beta.py
          sh -n scripts/install_arm64_beta.sh
          python3 -m unittest discover -s tests -p test_arm64_beta.py -v
          python3 -m unittest discover -s tests -p test_arm64_matrix.py -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/compatibility-matrix.json").read_text())
          assert len(data["sdk_verified"])==5
          assert len(data["arm64_candidates"])==6
          assert not any(x["firmware"]=="istoreos" for x in data["sdk_verified"])
          record=json.loads(Path("docs/evidence/arm64-public-beta-0.21.5-assets.json").read_text())
          assert record["physical_router_acceptance"]=="not_run"
          assert not record["production_sdk_verified_modified"]
          assert len(record["vendor_artifacts"])==4
          PY
